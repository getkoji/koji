name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check cli/ services/ tests/
      - run: ruff format --check cli/ services/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The CLI no longer compares values itself — `koji test`, `koji bench`
      # and `koji score` all shell out to @koji/score. Without a build here,
      # every test that scores anything would fall through to `npx` and try to
      # fetch an unpublished package, so the suite would only ever exercise
      # mocks.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @koji/score
      - run: pnpm --filter @koji/score build

      - run: pip install -e ".[dev]"
      - run: pytest -v --cov --cov-report=term-missing -m "not slow"
      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
