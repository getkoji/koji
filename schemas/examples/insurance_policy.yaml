name: insurance_policy
description: Commercial insurance policy extraction

# Document categories — used by the classifier to label sections.
# Define categories relevant to your document type.
categories:
  keywords:
    declarations: ["declaration", "dec page", "named insured", "policy period"]
    schedule_of_coverages: ["schedule of", "coverage schedule", "limits of"]
    endorsement: ["endorsement", "amendment", "rider", "this endorsement modifies"]
    conditions: ["conditions", "general conditions", "policy conditions"]
    exclusions: ["exclusion", "does not apply", "we will not"]

# Classification tuning — optional. Defaults scan the first 500 chars of a
# chunk and require 2+ keyword hits to match a category. Policy documents
# tend to have long sections where the classifying keywords cluster near
# the top or bottom, so we widen the scan window here.
classification:
  window: 1500
  scan: head_and_tail

# Heading inference — optional. Only runs when the parsed markdown has no
# `#` headings. Declare policy-specific structural markers so endorsement
# forms get their own chunks even when OCR loses the heading hierarchy.
headings:
  patterns:
    - "^ENDORSEMENT\\s*[A-Z0-9-]*$"
    - "^FORM\\s+[A-Z]{2,}\\s+\\d+"

# Document fit — optional. Catches the "wrong document in this slot" case so a
# misfiled upload returns a clear signal instead of a wall of nulls. The
# keyword check is free; the derived signal reuses extraction grounding and
# defaults its anchors to the required fields below. `on_misfit: warn` always
# extracts and reports — switch to `reject` to skip extraction on a misfit.
# See docs/schema-guide.md#document-fit for the full contract.
fit:
  keywords: ["policy", "insured", "premium", "coverage"]
  min_keywords: 2
  min_score: 0.4
  on_misfit: warn

fields:
  policy_number:
    type: string
    required: true
    description: Policy number or ID
    hints:
      look_in: [declarations]
      patterns: ["policy.*(?:number|no|#)", "[A-Z]{2,5}\\d{5,}"]
      signals: [has_policy_numbers, has_key_value_pairs]

  insured_name:
    type: string
    required: true
    description: Named insured (policyholder)
    extraction_hint: >-
      The organization or person named as the insured — the value on the line
      directly below the "Named Insured"/"Named Insured and Address" caption,
      not the caption, the carrier, or a street/city line.
    hints:
      look_in: [declarations]
      patterns: ["(?:named\\s+)?insured", "policyholder"]
      signals: [has_name_references]
      # Critical scalar: extract it in isolation so its result is stable and not
      # perturbed by other fields' routing, and reject a label caption if the
      # model returns one instead of the value beneath it.
      isolate: true
      reject_caption: true
      # Alternative to reject_caption: recover the value from the line after the
      # label instead of nulling to review. Enable one or the other.
      # take_value_after_label: true

  effective_date:
    type: date
    required: true
    description: Policy effective date
    hints:
      look_in: [declarations]
      patterns: ["effective.*date", "policy\\s+period"]
      signals: [has_dates]

  expiration_date:
    type: date
    required: true
    description: Policy expiration date
    hints:
      look_in: [declarations]
      patterns: ["expir", "policy\\s+period"]
      signals: [has_dates]

  carrier:
    type: string
    description: Insurance carrier / company name
    hints:
      look_in: [declarations, common_policy]
      patterns: ["(?:insurance|carrier|company|underwr)", "(?:issued\\s+by|insurer)"]

  policy_type:
    type: enum
    description: Type of policy
    options:
      - BOP
      - General Liability
      - Workers Compensation
      - Commercial Property
      - Commercial Auto
      - Umbrella
      - Excess Liability
      - Professional Liability
      - Directors & Officers
      - Employment Practices Liability
      - Cyber Liability
      - Other
    hints:
      look_in: [declarations]
      patterns: ["(?:type|kind|form).*(?:policy|coverage)", "businessowners", "general\\s+liability"]

  premium:
    type: number
    description: Total premium amount
    hints:
      look_in: [declarations]
      patterns: ["(?:total\\s+)?premium", "(?:annual|policy)\\s+premium"]
      signals: [has_dollar_amounts]
      prefer: declarations

  agent_name:
    type: string
    description: Agent or broker name
    hints:
      look_in: [declarations]
      patterns: ["agent", "broker", "producer"]

  agency_name:
    type: string
    description: Agency name
    hints:
      look_in: [declarations]
      patterns: ["agency", "brokerage"]

  coverages:
    type: array
    description: List of coverages with limits
    items:
      type: object
      properties:
        coverage_name:
          type: string
        limit:
          type: string
        deductible:
          type: string
    hints:
      look_in: [schedule_of_coverages, declarations]
      signals: [has_tables, has_dollar_amounts]
      patterns: ["coverage", "limit", "deductible"]
      # Score with F1: match elements by coverage_name so validate reports
      # precision/recall honestly and recall (finding more parts) isn't penalized.
      element_key: coverage_name
      # When multiple coverage parts are stacked in ONE section/table, a single
      # pass under-counts the rows — enumerate_rows runs a completion pass to
      # list every row.
      enumerate_rows: true
      # Enumeration is faithful to the source, so rows that are listed but not
      # actually bound ("$0", "Not Covered", "If Included") come back as data.
      # skip_row_when drops any row whose values — or whose verbatim source
      # line — match one of these patterns (case-insensitive; prompt
      # instruction + deterministic post-filter). Uncomment + tune to your
      # documents' not-applicable markers:
      # skip_row_when: ["^\\$?0(\\.00)?$", "Not Covered", "If Included"]
      # On a big multi-part package, gate which sections per_section visits so it
      # doesn't emit spurious rows out of boilerplate. Uncomment + tune to your
      # carrier's section headings:
      # section_anchor: "COVERAGE PART DECLARATIONS|SCHEDULE OF COVERAGES"
      # Sections that MENU coverages as available/optional (with example
      # amounts that look real) should never be read at all — the veto also
      # shields the enumerate_rows pass:
      # section_exclude: ["OPTIONAL COVERAGES", "AVAILABLE COVERAGES"]
      # Large multi-part packages scatter coverage sections across many pages.
      # per_section guarantees one chunk from EACH distinct section reaches the
      # extractor, instead of only the globally top-scoring few.
      per_section: true
